# slam_toolbox config — tuned for Canary Rover mine tunnel
# Tunnel is ~3.2 m wide × 60 m long, rover scans at 10 Hz

slam_toolbox:
  ros__parameters:

    # --- Frames ---
    odom_frame:    odom
    map_frame:     map
    base_frame:    base_link
    scan_topic:    /scan
    use_sim_time:  false

    # --- Mode ---
    mode: mapping            # use 'localization' once map is saved

    # --- Scan matching ---
    # Correlative scan matcher — good for featureless tunnels
    solver_plugin:      solver_plugins::CeresSolver
    ceres_linear_solver:    SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:   SCHUR_JACOBI
    ceres_trust_strategy:   LEVENBERG_MARQUARDT
    ceres_dogleg_type:      TRADITIONAL_DOGLEG

    # Scan buffer
    scan_buffer_size:            10
    scan_buffer_maximum_scan_distance: 10.0

    # Link matching — how far rover can move between scan-matches
    link_match_minimum_response_fine:  0.1
    link_scan_maximum_distance:        2.0
    loop_search_maximum_distance:      5.0
    do_loop_closing:                   true
    loop_match_minimum_chain_size:     3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine:   0.45

    # Correlation parameters
    correlation_search_space_dimension:   0.5
    correlation_search_space_resolution:  0.01
    correlation_search_space_smear_deviation: 0.1

    # Distance / angle thresholds for inserting new scan
    minimum_travel_distance: 0.15    # metres — mine rover moves slowly
    minimum_travel_heading:  0.05    # radians

    # Map parameters
    map_update_interval:  2.0        # seconds
    resolution:           0.05       # metres/cell — matches original SLAM

    # Throttle to avoid overloading on slow hardware
    throttle_scans:       1
    transform_publish_period: 0.02
    transform_timeout:    0.5
    tf_buffer_duration:   30.0
