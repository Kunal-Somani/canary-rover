<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Torque Visualizer</title>
    <style>
        :root {
            --bg-dark: #1e1e24;
            --bg-panel: #2b2b36;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --accent-blue: #4dabf7;
            --accent-green: #40c057;
            --accent-red: #fa5252;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .app-container {
            background: var(--bg-panel);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Top Metrics Bar */
        .metrics-bar {
            display: flex;
            justify-content: space-between;
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .metric {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: bold;
        }
        .metric-value {
            font-size: 1.25rem;
            font-weight: bold;
            font-family: monospace;
        }
        .highlight { color: var(--accent-blue); }

        /* Visualization Area */
        .canvas-container {
            width: 100%;
            height: 350px;
            background: #1a1a20;
            position: relative;
        }
        svg { width: 100%; height: 100%; display: block; }

        /* Controls Bottom */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            font-weight: 500;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--accent-blue);
        }
        .val-display {
            background: rgba(0,0,0,0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            min-width: 40px;
            text-align: center;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="metrics-bar">
        <div class="metric">
            <span class="metric-label">Weight</span>
            <span class="metric-value" id="valWeight">0.0 N</span>
        </div>
        <div class="metric">
            <span class="metric-label">Parallel Force</span>
            <span class="metric-value" style="color: var(--accent-red)" id="valParallel">0.0 N</span>
        </div>
        <div class="metric">
            <span class="metric-label">Normal Force</span>
            <span class="metric-value" style="color: var(--accent-green)" id="valNormal">0.0 N</span>
        </div>
        <div class="metric">
            <span class="metric-label">Friction</span>
            <span class="metric-value" style="color: var(--accent-red)" id="valFriction">0.0 N</span>
        </div>
        <div class="metric">
            <span class="metric-label">Req. Torque / Wheel</span>
            <span class="metric-value highlight" id="valTorque">0.00 Nm</span>
        </div>
    </div>

    <div class="canvas-container">
        <svg viewBox="0 0 800 350">
            <defs>
                <marker id="arrow-white" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 z" fill="#ffffff" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 z" fill="#40c057" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 z" fill="#fa5252" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 z" fill="#4dabf7" />
                </marker>
            </defs>

            <g transform="translate(400, 220)">
                <g id="sceneRotator">
                    <rect x="-800" y="0" width="1600" height="400" fill="#24242e" />
                    <line x1="-800" y1="0" x2="800" y2="0" stroke="#444" stroke-width="2" />
                    
                    <text x="100" y="25" fill="#adb5bd" font-size="12" font-family="monospace" id="angleLabel">15° INCLINE</text>

                    <rect x="-60" y="-40" width="120" height="35" fill="#a5d8ff" rx="4" />
                    <circle id="wheel1" cx="-35" cy="-5" r="10" fill="#868e96" />
                    <circle id="wheel2" cx="35" cy="-5" r="10" fill="#868e96" />
                    <circle cx="0" cy="-22.5" r="3" fill="#1e1e24" /> <line x1="0" y1="-22.5" x2="0" y2="-100" stroke="#40c057" stroke-width="3" marker-end="url(#arrow-green)" id="vecNormal" />
                    
                    <line x1="0" y1="-22.5" x2="-80" y2="-22.5" stroke="#fa5252" stroke-width="3" marker-end="url(#arrow-red)" id="vecResist" />
                    
                    <line x1="0" y1="-22.5" x2="80" y2="-22.5" stroke="#4dabf7" stroke-width="3" marker-end="url(#arrow-blue)" id="vecDrive" />
                </g>

                <line x1="0" y1="-22.5" x2="0" y2="100" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)" id="vecGravity" />
            </g>
        </svg>
    </div>

    <div class="controls">
        <label>Mass (kg)
            <div class="slider-row">
                <input type="range" id="inpMass" min="1" max="50" value="10" step="1">
                <div class="val-display" id="lblMass">10</div>
            </div>
        </label>
        <label>Incline Angle (°)
            <div class="slider-row">
                <input type="range" id="inpAngle" min="0" max="45" value="15" step="1">
                <div class="val-display" id="lblAngle">15</div>
            </div>
        </label>
        <label>Friction Coefficient (μ)
            <div class="slider-row">
                <input type="range" id="inpFriction" min="0" max="1" value="0.1" step="0.01">
                <div class="val-display" id="lblFriction">0.1</div>
            </div>
        </label>
        <label>Wheel Diameter (cm)
            <div class="slider-row">
                <input type="range" id="inpDiameter" min="10" max="50" value="20" step="1">
                <div class="val-display" id="lblDiameter">20</div>
            </div>
        </label>
    </div>
</div>

<script>
    const g = 9.81;
    const VECTOR_SCALE = 0.5; // Scales pixels per Newton for visuals

    function update() {
        // Read values
        const m = parseFloat(document.getElementById('inpMass').value);
        const theta = parseFloat(document.getElementById('inpAngle').value);
        const mu = parseFloat(document.getElementById('inpFriction').value);
        const d_cm = parseFloat(document.getElementById('inpDiameter').value);

        // Update UI Labels
        document.getElementById('lblMass').innerText = m;
        document.getElementById('lblAngle').innerText = theta;
        document.getElementById('lblFriction').innerText = mu;
        document.getElementById('lblDiameter').innerText = d_cm;

        // Physics Math
        const rad = theta * (Math.PI / 180);
        const Fg = m * g;
        const Fgx = Fg * Math.sin(rad);
        const FN = Fg * Math.cos(rad);
        const Ff = mu * FN;
        const Ftotal = Fgx + Ff;
        
        const r_m = (d_cm / 2) / 100;
        const torquePerWheel = (Ftotal * r_m) / 4;

        // Update Top Bar Metrics
        document.getElementById('valWeight').innerText = Fg.toFixed(1) + ' N';
        document.getElementById('valParallel').innerText = Fgx.toFixed(1) + ' N';
        document.getElementById('valNormal').innerText = FN.toFixed(1) + ' N';
        document.getElementById('valFriction').innerText = Ff.toFixed(1) + ' N';
        document.getElementById('valTorque').innerText = torquePerWheel.toFixed(3) + ' Nm';

        // Update Visual Animations
        document.getElementById('sceneRotator').setAttribute('transform', `rotate(${-theta})`);
        document.getElementById('angleLabel').textContent = `${theta}° INCLINE`;

        // Update wheel sizes dynamically visually (1px = 1cm for simplicity)
        const visualRadius = d_cm / 2;
        document.getElementById('wheel1').setAttribute('r', visualRadius);
        document.getElementById('wheel2').setAttribute('r', visualRadius);
        // Adjust robot height slightly based on wheel size so it doesn't clip floor
        document.getElementById('wheel1').setAttribute('cy', -visualRadius + 5);
        document.getElementById('wheel2').setAttribute('cy', -visualRadius + 5);

        // Update Vector Lengths (with a minimum visual length so arrows don't glitch at 0)
        const cmY = -22.5; // Center of mass Y pos
        document.getElementById('vecGravity').setAttribute('y2', cmY + Math.max(15, Fg * VECTOR_SCALE));
        document.getElementById('vecNormal').setAttribute('y2', cmY - Math.max(15, FN * VECTOR_SCALE));
        document.getElementById('vecResist').setAttribute('x2', -Math.max(15, Ftotal * VECTOR_SCALE));
        document.getElementById('vecDrive').setAttribute('x2', Math.max(15, Ftotal * VECTOR_SCALE));
    }

    // Attach Listeners
    document.getElementById('inpMass').addEventListener('input', update);
    document.getElementById('inpAngle').addEventListener('input', update);
    document.getElementById('inpFriction').addEventListener('input', update);
    document.getElementById('inpDiameter').addEventListener('input', update);

    // Initial Draw
    update();
</script>

</body>
</html>
